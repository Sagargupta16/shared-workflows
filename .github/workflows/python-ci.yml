name: Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      working-directory:
        type: string
        default: "."
      run-tests:
        type: boolean
        default: true

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            uv venv
            uv pip install -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            uv sync --all-extras 2>/dev/null || uv sync 2>/dev/null || (uv venv && uv pip install .)
          else
            echo "No dependency file found, skipping install"
          fi

      - name: Ruff check
        run: |
          if uv run ruff --version 2>/dev/null; then
            uv run ruff check . || true
          fi

      - name: Ruff format check
        run: |
          if uv run ruff --version 2>/dev/null; then
            uv run ruff format --check . || true
          fi

      - name: Pytest
        if: inputs.run-tests
        run: |
          if uv run python -c "import pytest" 2>/dev/null; then
            uv run pytest -q || true
          fi
