name: Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      working-directory:
        type: string
        default: "."
      run-tests:
        type: boolean
        default: true

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f "uv.lock" ]; then
            uv sync --locked --all-extras
          elif [ -f "requirements.txt" ]; then
            uv venv
            uv pip install -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            uv sync --all-extras
          else
            echo "No dependency file found, skipping install"
          fi

      # Each gate skips only when its tool is not installed; once it runs, its exit code fails the job.
      - name: Ruff check
        run: |
          if uv run --no-sync ruff --version >/dev/null 2>&1; then
            uv run --no-sync ruff check .
          else
            echo "::notice::ruff is not installed, skipping lint"
          fi

      - name: Ruff format check
        run: |
          if uv run --no-sync ruff --version >/dev/null 2>&1; then
            uv run --no-sync ruff format --check .
          else
            echo "::notice::ruff is not installed, skipping format check"
          fi

      - name: Pytest
        if: inputs.run-tests
        run: |
          if ! uv run --no-sync python -c "import pytest" >/dev/null 2>&1; then
            echo "::notice::pytest is not installed, skipping tests"
            exit 0
          fi
          rc=0
          uv run --no-sync pytest -q || rc=$?
          # pytest exits 5 when it collects no tests; an empty suite is not a failure
          if [ "$rc" -eq 5 ]; then
            echo "::notice::pytest collected no tests"
            exit 0
          fi
          exit "$rc"
