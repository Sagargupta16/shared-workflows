name: Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      working-directory:
        type: string
        default: "."
      run-tests:
        type: boolean
        default: true

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f "pyproject.toml" ]; then
            uv sync
          elif [ -f "requirements.txt" ]; then
            uv pip install -r requirements.txt
          fi

      - name: Ruff check
        run: |
          if uv run ruff --version 2>/dev/null; then
            uv run ruff check .
          elif command -v ruff 2>/dev/null; then
            ruff check .
          fi

      - name: Ruff format check
        run: |
          if uv run ruff --version 2>/dev/null; then
            uv run ruff format --check .
          fi

      - name: Pytest
        if: inputs.run-tests
        run: |
          if [ -d "tests" ] || [ -f "pytest.ini" ] || grep -q "pytest" pyproject.toml 2>/dev/null; then
            uv run pytest -q
          fi
